name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up tools
        uses: jdx/mise-action@v5
      - name: Restore
        run: dotnet restore tests/CSharp15Adt.Tests/CSharp15Adt.Tests.csproj
      - name: Check formatting
        run: |
          dotnet format csharp-15-adt.csproj --verify-no-changes --no-restore
          dotnet format tests/CSharp15Adt.Tests/CSharp15Adt.Tests.csproj --verify-no-changes --no-restore
      - name: Build
        run: dotnet build tests/CSharp15Adt.Tests/CSharp15Adt.Tests.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/CSharp15Adt.Tests/CSharp15Adt.Tests.csproj --configuration Release --no-build
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh
      - name: Lint GitHub Actions workflows
        run: actionlint
      - name: Verify sample output
        run: bash scripts/verify-output.sh
