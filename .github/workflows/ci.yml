name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-rc.3.26522.148
      - name: Restore
        run: dotnet restore csharp-15-adt.csproj
      - name: Build
        run: dotnet build csharp-15-adt.csproj --configuration Release --no-restore
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh
      - name: Verify sample output
        run: bash scripts/verify-output.sh
