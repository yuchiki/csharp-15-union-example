name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x
      - name: Restore
        run: dotnet restore csharp-15-adt.csproj
      - name: Build
        run: dotnet build csharp-15-adt.csproj --configuration Release --no-restore
      - name: Run sample
        run: dotnet run --project csharp-15-adt.csproj --configuration Release --no-build
