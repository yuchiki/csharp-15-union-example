name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.100-rc.3.26522.148
      - name: Restore
        run: dotnet restore csharp-15-adt.csproj
      - name: Build
        run: dotnet build csharp-15-adt.csproj --configuration Release --no-restore
      - name: Verify sample output
        shell: bash
        run: |
          expected=$'10\nAdd(Mul(CInt(3), CInt(2)), Div(CInt(20), CInt(5)))'
          actual="$(dotnet run --project csharp-15-adt.csproj --configuration Release --no-build)"

          if [[ "$actual" != "$expected" ]]; then
            printf 'Expected:\n%s\n\nActual:\n%s\n' "$expected" "$actual"
            exit 1
          fi

          printf '%s\n' "$actual"
